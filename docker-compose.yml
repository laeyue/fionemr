services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aerohealth-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
      BACKEND_URL: ${BACKEND_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:5000:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: aerohealth-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
